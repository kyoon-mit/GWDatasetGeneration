general:
    type: 'BNS_IMRPhenomPv2'
    num_waveforms: 100
    waveform_duration: 64 #desired duration of time-domain waveform
    sample_rate: 4096
    bkg_sample_rate: 4096
    downsample_rate: 16
    right_pad: 1.0 #coalescence point of signal [s] from right edge of window 
    f_min: 20
    f_max: 1024
    f_ref: 50
    ifos: ['H1','L1']
    batch_size: 100

waveform:
    mass_1:
        func: torch.distributions.Uniform    # waveforms.py automatically sorts mass_1 and mass_2, such that m1 >= m2
        args: [0.8, 2.8]
    mass_2:
        func: torch.distributions.Uniform
        args: [0.8, 2.8]
    a_1:
        func: torch.distributions.Uniform
        args: [0, 0.998]
    a_2:
        func: torch.distributions.Uniform
        args: [0, 0.998]
    tilt_1:
        func: ml4gw.distributions.Sine
    tilt_2:
        func: ml4gw.distributions.Sine
    phi_12:
        func: torch.distributions.Uniform
        args: [0, 6.283185307179586]
    phi_jl:
        func: torch.distributions.Uniform
        args: [0, 6.283185307179586]
    distance:
        func: ml4gw.distributions.PowerLaw
        args: [100, 1000, 2]
    phic:
        func: torch.distributions.Uniform
        args: [0, 6.283185307179586]
    inclination:
        func: ml4gw.distributions.Sine
    # dec, psi, phi (RA) can optionally be specified here to override the
    # isotropic defaults in waveforms.py. If omitted, defaults are used:
    #   dec ~ Cosine, psi ~ Uniform(0, pi), phi ~ Uniform(-pi, pi)
    # dec:
    #     func: ml4gw.distributions.Cosine
    # psi:
    #     func: torch.distributions.Uniform
    #     args: [0, 3.141592653589793]
    # phi:
    #     func: torch.distributions.Uniform
    #     args: [-3.141592653589793, 3.141592653589793]

whiten:
    fftlength: 2
    average: median
    overlap: null
    psd_length: 64
    fduration: 2

snr_reweighting: 
    func: ml4gw.distributions.PowerLaw
    args: [5,50]
